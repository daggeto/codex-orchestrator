[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codex-orchestrator"
version = "0.1.0"
description = "Multi-agent orchestrator for Codex and Claude Code"
requires-python = ">=3.12"
dependencies = [
    "websockets>=14.0",
    "aiosqlite>=0.20.0",
    "click>=8.1",
    "aiohttp>=3.10",
]

[project.scripts]
orch = "orchestrator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]
